name: e15j-cleanroom-c

on:
  workflow_dispatch: {}
  push:
    branches:
      - cm/e15j-cleanroom-c

jobs:
  verify3:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            cc: gcc
          - os: ubuntu-24.04
            arch: x86_64
            cc: clang
          - os: ubuntu-24.04-arm
            arch: aarch64
            cc: gcc
          - os: ubuntu-24.04-arm
            arch: aarch64
            cc: clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang binutils curl

      - name: Fetch pinned weights (SmolLM2-135M)
        run: |
          mkdir -p weights
          curl -sSf -L --retry 6 --retry-all-errors \
            -o weights/model.safetensors \
            https://huggingface.co/HuggingFaceTB/SmolLM2-135M/resolve/main/model.safetensors
          curl -sSf -L --retry 6 --retry-all-errors \
            -o weights/config.json \
            https://huggingface.co/HuggingFaceTB/SmolLM2-135M/resolve/main/config.json
          curl -sSf -L --retry 6 --retry-all-errors \
            -o weights/tokenizer.json \
            https://huggingface.co/HuggingFaceTB/SmolLM2-135M/resolve/main/tokenizer.json

      - name: Assert model.safetensors sha256
        run: |
          expected=80521b40281d6ce74e35c9282c22539e75aa0ac8578892b2a59955ef78d55da1
          got=$(sha256sum weights/model.safetensors | awk '{print $1}')
          echo "expected=$expected got=$got"
          test "$got" = "$expected"

      - name: Build verify3 (${{ matrix.cc }}, ${{ matrix.arch }})
        working-directory: verify3
        run: make CC=${{ matrix.cc }}

      - name: FMA gate (objdump, zero fused multiply-add on decode path)
        working-directory: verify3
        run: |
          objdump -d cis2_verify3 > /tmp/disasm.txt
          if grep -Ei 'vfmadd|vfnmadd|vfmsub|vfnmsub|fmadd|fmsub|fmla|fmls' /tmp/disasm.txt; then
            echo "FMA-family instruction found in disassembly — spec 1.4 violation"
            exit 1
          fi
          echo "FMA gate: PASS (0 matches)"

      - name: Run cis2_verify3
        working-directory: verify3
        run: ./cis2_verify3 ../weights/model.safetensors ../weights/config.json ../weights/tokenizer.json | tee /tmp/verify3_output.txt

      - name: Compare digests against v0.2 pinned test vector (spec §13.1)
        run: |
          out=/tmp/verify3_output.txt
          witness=$(grep -oP '(?<=^CIS2_VERIFY3 digest=)[0-9a-f]+' "$out")
          argmax=$(grep -oP '(?<=^CIS2_VERIFY3 argmax_digest=)[0-9a-f]+' "$out")
          table=$(grep -oP '(?<=^CIS2_VERIFY3 table_digest=)[0-9a-f]+' "$out")
          invfreq=$(grep -oP '(?<=^CIS2_VERIFY3 inv_freq_table_digest=)[0-9a-f]+' "$out")

          exp_witness=a0c563ef804f50413b7fb6619ae4afe9b51b1ffa7655e944221393e85d6261da
          exp_argmax=0b9c8f3ac90d0b9cd5f1719ac327dca1fc639fd87468305fccebbe3d56f67aff
          exp_table=465d358ccd63721256dbd2abbc77ad5de755adf3230635f95b12b1727dfa1ea3
          exp_invfreq=da9f6dcfde0425588815509e874515cdcd3d6b8818b6d0136590052e7bbf6f12

          echo "witness: got=$witness expected=$exp_witness"
          echo "argmax:  got=$argmax expected=$exp_argmax"
          echo "table:   got=$table expected=$exp_table"
          echo "invfreq: got=$invfreq expected=$exp_invfreq"

          fail=0
          [ "$witness" = "$exp_witness" ] || { echo "MISMATCH: witness digest (CIS2_REF)"; fail=1; }
          [ "$argmax" = "$exp_argmax" ] || { echo "MISMATCH: argmax digest"; fail=1; }
          [ "$table" = "$exp_table" ] || { echo "MISMATCH: table digest"; fail=1; }
          [ "$invfreq" = "$exp_invfreq" ] || { echo "MISMATCH: inv_freq_table digest"; fail=1; }
          exit $fail
