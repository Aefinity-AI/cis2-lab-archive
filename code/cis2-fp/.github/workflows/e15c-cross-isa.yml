name: E15c cross-ISA CIS-2 fp32 reference

on:
  push:
    branches: [cm/e15c-cross-isa]
  workflow_dispatch: {}

env:
  TARGET_DIGEST: d82743059d1db929e710236fe4ec37f89e6f932524801345a006980f7c3cc9df
  TARGET_INVFREQ_DIGEST: da9f6dcfde0425588815509e874515cdcd3d6b8818b6d0136590052e7bbf6f12

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch_label: x86_64
          - os: ubuntu-24.04-arm
            arch_label: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: uname (assert matches expected arch)
        run: |
          U=$(uname -m)
          echo "uname -m = $U"
          if [ "${{ matrix.arch_label }}" = "x86_64" ]; then
            [ "$U" = "x86_64" ] || { echo "expected x86_64, got $U"; exit 1; }
          else
            [ "$U" = "aarch64" ] || { echo "expected aarch64, got $U"; exit 1; }
          fi

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: rustc version
        run: rustc -V

      - name: Fetch SmolLM2-135M weights (public HF resolve, no auth)
        run: |
          mkdir -p weights
          curl -sSf -L --retry 6 --retry-delay 10 --retry-all-errors -o weights/config.json     https://huggingface.co/HuggingFaceTB/SmolLM2-135M/resolve/main/config.json
          curl -sSf -L --retry 6 --retry-delay 10 --retry-all-errors -o weights/tokenizer.json  https://huggingface.co/HuggingFaceTB/SmolLM2-135M/resolve/main/tokenizer.json
          curl -sSf -L --retry 6 --retry-delay 10 --retry-all-errors -o weights/model.safetensors https://huggingface.co/HuggingFaceTB/SmolLM2-135M/resolve/main/model.safetensors
          sha256sum weights/model.safetensors weights/config.json weights/tokenizer.json
          echo "80521b40281d6ce74e35c9282c22539e75aa0ac8578892b2a59955ef78d55da1  weights/model.safetensors" | sha256sum -c - || { echo "weights download corrupt/empty"; exit 1; }

      - name: cargo test --release (unit tests + FMA grep gate)
        run: cargo test --release

      - name: no_fma_gate.sh
        run: ./scripts/no_fma_gate.sh

      - name: Build release
        run: cargo build --release

      - name: Run reference, assert digest matches pre-registered target
        run: |
          OUT=$(nice -n 10 ./target/release/cis2_ref 2>&1)
          echo "$OUT"
          LINE=$(echo "$OUT" | grep -E '^CIS2_REF digest=' | head -1)
          INVFREQ=$(echo "$OUT" | grep -E '^inv_freq[ _]table_digest=' | head -1)
          DIGEST=$(echo "$LINE" | sed -n 's/.*digest=\([0-9a-f]*\).*/\1/p')
          INVFREQ_DIGEST=$(echo "$INVFREQ" | sed -n 's/.*table_digest=\([0-9a-f]*\).*/\1/p')
          echo "got digest=$DIGEST target=$TARGET_DIGEST"
          echo "got inv_freq table_digest=$INVFREQ_DIGEST target=$TARGET_INVFREQ_DIGEST"
          if [ "$DIGEST" != "$TARGET_DIGEST" ]; then
            echo "MISMATCH: CIS2_REF digest does not match pre-registered target on ${{ matrix.arch_label }}"
            exit 1
          fi
          if [ "$INVFREQ_DIGEST" != "$TARGET_INVFREQ_DIGEST" ]; then
            echo "MISMATCH: inv_freq table_digest does not match pre-registered target on ${{ matrix.arch_label }}"
            exit 1
          fi
          echo "PASS on ${{ matrix.arch_label }}: digests match pre-registered target"
